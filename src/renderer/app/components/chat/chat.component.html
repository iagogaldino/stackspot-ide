<div class="chat-container">
  <!-- Header fixo no topo -->
  <div class="chat-header">
    <h3>Assistente IA</h3>
    <button 
      *ngIf="isServiceConfigured" 
      class="settings-button"
      (click)="showServiceConfig = !showServiceConfig"
      title="Configurações">
      ⚙️
    </button>
  </div>

  <!-- Input de API Key -->
  <div class="api-key-container" *ngIf="showServiceConfig">
    <div class="api-key-input-wrapper">
      <input
        type="text"
        [(ngModel)]="serviceUrl"
        placeholder="Informe a URL do serviço ServiceIA (ex: http://localhost:3000)"
        class="api-key-input"
        (keydown.enter)="$event.preventDefault(); saveServiceConfig()">
      <button 
        (click)="saveServiceConfig()" 
        [disabled]="!serviceUrl.trim()"
        class="save-key-button">
        Salvar
      </button>
    </div>
    <p class="api-key-hint">
      Deixe o serviço DelsucIA rodando em <code>http://localhost:3000</code> ou ajuste o endereço conforme sua infraestrutura.
    </p>
  </div>
  
  <!-- Área de mensagens com scroll -->
  <div class="chat-messages" #messagesContainer>
    <div 
      *ngFor="let message of messages; let i = index" 
      class="message"
      [class.user-message]="message.role === 'user'"
      [class.assistant-message]="message.role === 'assistant'">
      <div class="message-content">
        <!-- Mostrar conteúdo da mensagem com efeito de digitação em código -->
        <div *ngIf="message.content" class="message-text">
          <ng-container *ngFor="let part of renderMessageContent(message)">
            <div *ngIf="part.type === 'text'" class="message-text-part">{{ part.content }}</div>
            <app-code-block 
              *ngIf="part.type === 'code'" 
              [code]="part.content" 
              [language]="part.language || 'typescript'"
              [enableTyping]="message.role === 'assistant'"
              [typingSpeed]="15">
            </app-code-block>
          </ng-container>
        </div>
        <!-- Se houver arquivo criado, mostrar badge clicável -->
        <div *ngIf="message.createdFile" class="created-file-badge-container">
          <div class="created-file-badge" (click)="openCreatedFile(message.createdFile!)" title="Clique para abrir o arquivo">
            <span class="file-icon">📄</span>
            <span class="file-name">{{ getFileName(message.createdFile) }}</span>
          </div>
          <button 
            class="run-test-button" 
            (click)="runTest(message.createdFile!, $event)"
            title="Executar teste">
            ▶️
          </button>
        </div>
        <!-- Mini terminal para execução de teste -->
        <app-mini-terminal
          *ngIf="message.testExecution?.isRunning"
          [command]="message.testExecution!.command"
          [onClose]="getCloseTestTerminalCallback(i)"
          [onTestFailed]="getTestFailedCallback(i)">
        </app-mini-terminal>
        
        <!-- Botão para gerar teste corrigido quando falhar -->
        <div *ngIf="message.testExecution?.hasFailed && message.testExecution?.errorDetails" class="test-failure-container">
          <div class="test-failure-message">
            <span class="failure-icon">❌</span>
            <span class="failure-text">Teste falhou</span>
          </div>
          <button 
            class="fix-test-button"
            (click)="generateFixedTest(i, message.testExecution!.errorDetails!)"
            title="Gerar teste corrigido baseado no erro">
            🔧 Gerar teste corrigido
          </button>
        </div>
        <div class="message-time">{{ formatTime(message.timestamp) }}</div>
      </div>
    </div>
    
    <!-- Indicador de digitação -->
    <div *ngIf="isTyping" class="message assistant-message">
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    
    <!-- Espaço no final para garantir que a última mensagem seja visível -->
    <div class="messages-end-spacer"></div>
  </div>
  
  <!-- Input fixo no bottom -->
  <div class="chat-input-container">
    <!-- Badge do arquivo aberto -->
    <div class="file-badge" *ngIf="selectedFile && showFileBadge">
      <span class="file-icon">📄</span>
      <span class="file-name">{{ getFileName(selectedFile) }}</span>
      <button 
        class="file-badge-close" 
        (click)="removeFileFromContext()"
        title="Remover arquivo do contexto">
        ×
      </button>
    </div>
    
    <div class="input-wrapper">
      <textarea
        #messageInput
        [(ngModel)]="userMessage"
        (keydown.enter)="$event.preventDefault(); sendMessage()"
        (keydown.shift.enter)="true"
        placeholder="Digite sua mensagem... (Enter para enviar, Shift+Enter para nova linha)"
        class="chat-input"
        rows="1">
      </textarea>
      <button 
        (click)="sendMessage()" 
        [disabled]="!userMessage.trim() || isTyping"
        class="send-button"
        title="Enviar mensagem">
        <span class="send-icon">➤</span>
      </button>
    </div>
  </div>
</div>
