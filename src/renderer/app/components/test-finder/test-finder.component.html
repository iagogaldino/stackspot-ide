<div class="test-finder">
  <div class="test-finder-header">
    <h3>🧪 Arquivos de Teste</h3>
    <div class="header-actions">
      <button 
        class="refresh-btn"
        (click)="loadTestFiles()"
        [disabled]="loading"
        title="Atualizar lista">
        {{ loading ? '⏳' : '🔄' }}
      </button>
    </div>
  </div>

  <div class="test-finder-content">
    <!-- Loading -->
    <div class="test-finder-loading" *ngIf="loading">
      <p>Buscando arquivos de teste...</p>
    </div>

    <!-- Error -->
    <div class="test-finder-error" *ngIf="error && !loading">
      <p>❌ {{ error }}</p>
    </div>

    <!-- Empty state -->
    <div class="test-finder-empty" *ngIf="!loading && !error && testFiles.length === 0">
      <p>Nenhum arquivo de teste encontrado</p>
      <p class="hint">Arquivos .spec.ts, .test.ts serão exibidos aqui</p>
    </div>

    <!-- Test files list -->
    <div class="test-files-list" *ngIf="!loading && !error && testFiles.length > 0">
      <!-- Selection controls -->
      <div class="selection-controls">
        <button 
          class="select-btn" 
          (click)="selectAll()"
          [disabled]="testFiles.length === 0"
          title="Selecionar todos">
          Selecionar Todos
        </button>
        <button 
          class="select-btn" 
          (click)="deselectAll()"
          [disabled]="selectedTests.size === 0"
          title="Desmarcar todos">
          Desmarcar Todos
        </button>
        <span class="selection-count" *ngIf="selectedTests.size > 0">
          {{ selectedTests.size }} selecionado(s)
        </span>
      </div>

      <!-- Files with checkboxes -->
      <div 
        class="test-file-item"
        *ngFor="let file of testFiles"
        [class.selected]="isTestSelected(file)">
        <input 
          type="checkbox"
          class="test-file-checkbox"
          [checked]="isTestSelected(file)"
          (change)="toggleTestSelection(file, $event)"
          (click)="$event.stopPropagation()">
        <span class="test-file-icon">🧪</span>
        <span 
          class="test-file-name" 
          (click)="openTestFile(file, $event)"
          title="Clique para abrir">
          {{ getFileName(file) }}
        </span>
      </div>
    </div>

    <!-- Summary and Actions -->
    <div class="test-finder-summary" *ngIf="!loading && testFiles.length > 0">
      <p>{{ testFiles.length }} arquivo(s) de teste encontrado(s)</p>
      <button 
        class="generate-test-btn"
        (click)="generateTest()"
        [disabled]="selectedTests.size === 0"
        title="Gerar teste para os arquivos selecionados">
        ✨ Gerar Teste
      </button>
    </div>
  </div>
</div>
